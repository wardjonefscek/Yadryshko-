# Сборка установщиков (NFR-13): Windows — Cad+-<версия>-setup.exe (Inno Setup), Linux — архив с install.sh.
# Запускается тегом v* (тогда же создаётся релиз на GitHub) или вручную из вкладки Actions.
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust из rust-toolchain.toml
        run: rustup show
      - name: Версия
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Версия $v"
      - name: Сборка cadplus.exe
        run: cargo build --release -p cadplus-gui
      - name: Установщик (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" installer\cadplus.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup завершился с ошибкой" }
      - name: Проверка тихой установки и удаления
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\*.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/CURRENTUSER","/NORESTART" -Wait
          $app = Join-Path $env:LOCALAPPDATA "Programs\Cad+"
          if (-not (Test-Path "$app\cadplus.exe")) { throw "cadplus.exe не установлен в $app" }
          $lnk = Join-Path ([Environment]::GetFolderPath("Desktop")) "Cad+.lnk"
          if (-not (Test-Path $lnk)) { throw "Нет ярлыка на рабочем столе" }
          Write-Host "Установлено: $app, ярлык: $lnk"
          Start-Process "$app\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          Start-Sleep -Seconds 3
          if (Test-Path "$app\cadplus.exe") { throw "Удаление не убрало cadplus.exe" }
          Write-Host "Удаление прошло"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: dist/*.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust из rust-toolchain.toml
        run: rustup show
      - name: Сборка
        run: cargo build --release -p cadplus-gui
      - name: Архив
        run: |
          v=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          d="cadplus-$v-linux-x86_64"
          mkdir -p "dist/$d"
          cp target/release/cadplus assets/icon/cadplus.png installer/linux/cadplus.desktop installer/linux/install.sh docs/app.md "dist/$d/"
          tar -C dist -czf "dist/$d.tar.gz" "$d"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: dist/*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Релиз на GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          **Windows 10/11:** скачайте `Cad+-…-setup.exe` и запустите. Права администратора не нужны, ярлыки появятся на рабочем столе и в меню «Пуск».
          Установщик не подписан, поэтому Windows может показать «Система Windows защитила ваш компьютер» — нажмите «Подробнее» → «Выполнить в любом случае».

          **Linux:** распакуйте архив и запустите `./install.sh`.

          Результаты расчёта — оценка, они не заменяют статические испытания. DXF не отправлять в резку без проверки.
          NOTES
          gh release create "${{ github.ref_name }}" out/* --repo "${{ github.repository }}" --title "Cad+ ${{ github.ref_name }}" --notes-file notes.md
