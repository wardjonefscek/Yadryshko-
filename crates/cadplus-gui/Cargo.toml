[package]
name = "cadplus-gui"
description = "Cad+: окно программы — расчёт крыла, лонжеронов и нервюр"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "cadplus"
path = "src/main.rs"

[dependencies]
cadplus-aero = { path = "../cadplus-aero" }
cadplus-rib = { path = "../cadplus-rib" }
cadplus-topopt = { path = "../cadplus-topopt" }
eframe = { version = "0.37", features = ["glow"] }
egui_plot = "0.38"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
